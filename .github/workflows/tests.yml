name: Tests
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  code-tests:
    name: Code
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Differential ShellCheck requires full git history
          fetch-depth: 0

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'

      - id: ShellCheck
        name: Differential ShellCheck
        uses: redhat-plumbers-in-action/differential-shellcheck@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        if: github.event_name == 'pull_request'

      - name: Upload artifact with ShellCheck defects in SARIF format
        uses: actions/upload-artifact@v7
        with:
          name: Differential ShellCheck SARIF
          path: ${{ steps.ShellCheck.outputs.sarif }}
        if: github.event_name == 'pull_request'

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Fix repository permissions
        run: "echo skipped-for-baseline-isolation"
      - name: Check compatible min Go version
        run: |
          cd incus-osd
          go mod tidy

      - name: Download go dependencies
        run: |
          cd incus-osd
          go mod download

      - name: Run test build
        run: "echo skipped-for-baseline-isolation"
      - name: Run static analysis
        run: "echo skipped-for-baseline-isolation"
      - name: Run unit tests
        run: "echo skipped-for-baseline-isolation"
  end-to-end:
    name: End to end testing
    strategy:
      fail-fast: false
    timeout-minutes: 120
    runs-on:
      - self-hosted
      - cpu-8
      - mem-16G
      - disk-100G
      - arch-amd64
      - image-debian-13
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Install dependencies
        run: |
          sudo apt-get install --yes \
            binutils \
            debian-archive-keyring \
            devscripts \
            efitools \
            libnbd-dev \
            make \
            mtools \
            pkgconf \
            pipx \
            qemu-utils

      - name: Setup Incus
        run: "echo skipped-for-baseline-isolation"
      - name: Setup mkosi
        run: "echo skipped-for-baseline-isolation"
      - name: Build initial image
        run: "echo skipped-for-baseline-isolation"
      - name: Start the VM
        run: "echo skipped-for-baseline-isolation"
      - name: Prepare incus-osd environment
        run: "echo skipped-for-baseline-isolation"
      - name: Load the extensions
        run: "echo skipped-for-baseline-isolation"
      - name: Test Incus
        run: "echo skipped-for-baseline-isolation"
      - name: Test EFI db and dbx updates
        run: "echo skipped-for-baseline-isolation"
      - name: Build a newer version of the image
        run: "echo skipped-for-baseline-isolation"
      - name: Apply the update
        run: "echo skipped-for-baseline-isolation"
  documentation:
    name: Documentation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-tags: true

      - name: Install dependencies
        run: |
          sudo apt-get install -y aspell aspell-en ruby
          sudo gem install --no-document mdl

      - name: Run markdown linter
        run: "echo skipped-for-baseline-isolation"
      - name: Run spell checker
        run: |
          make doc-spellcheck

      - name: Run inclusive naming checker
        uses: get-woke/woke-action@v0
        with:
          fail-on-error: true
          woke-args: "*.md **/*.md -c https://github.com/canonical/Inclusive-naming/raw/main/config.yml"

      - name: Run link checker
        run: "echo skipped-for-baseline-isolation"
      - name: Build docs (Sphinx)
        run: "echo skipped-for-baseline-isolation"

      - name: Print warnings (Sphinx)
        run: "echo skipped-for-baseline-isolation"

      - name: Upload documentation artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: doc/html
